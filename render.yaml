services:
  - type: web
    name: shri-balaji-ops
    env: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase: { name: shri-balaji-db, property: connectionString }
databases:
  - name: shri-balaji-db
    plan: free
